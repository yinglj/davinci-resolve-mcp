name: P2-03 CI/CD - P1-02 & P1-03 Tests

on:
  push:
    branches:
      - feat/script-to-shots-placeholder-timeline
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: 语法检查和基础验证
  syntax-check:
    name: Syntax & Format Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # P1-02 Fusion Composition
    - name: Syntax check - Fusion Composition (Planning)
      run: python -m py_compile src/agent/planner/skills/fusion_composition.py
    
    - name: Syntax check - Fusion Composition (Executor)
      run: python -m py_compile src/agent/executor/skills/fusion_executor.py
    
    # P1-03 AutoColor & Audio
    - name: Syntax check - AutoColor & Audio (Advanced Integration)
      run: python -m py_compile src/agent/executor/skills/resolve_advanced_integration.py
    
    # P2-02 Real Testing
    - name: Syntax check - Real Testing Suites
      run: |
        python -m py_compile tests/test_real_resolve_connection.py
        python -m py_compile tests/test_real_fusion_composition.py
        python -m py_compile tests/test_real_color_automation.py
        python -m py_compile tests/test_real_fairlight_audio.py
        python -m py_compile tests/test_real_end_to_end_workflow.py
  
  # Job 2: P1-02 Fusion Composition 测试
  test-p1-02:
    name: P1-02 Fusion Composition Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run Fusion Composition unit tests
      run: |
        python -m pytest tests/test_fusion_composition.py -v --tb=short
      continue-on-error: false
    
    - name: Run Fusion real environment tests
      run: |
        python -m pytest tests/test_real_fusion_composition.py -v --tb=short
      continue-on-error: false
    
    - name: Generate test report
      if: always()
      run: |
        python -m pytest tests/test_fusion_composition.py tests/test_real_fusion_composition.py \
          --tb=short --no-header -q > p1-02-test-results.txt 2>&1 || true
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: p1-02-test-results
        path: p1-02-test-results.txt
  
  # Job 3: P1-03 AutoColor & Audio 测试
  test-p1-03:
    name: P1-03 AutoColor & Audio Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run P1-03 integration tests
      run: |
        python -m pytest tests/test_p1_03_integration.py -v --tb=short
      continue-on-error: false
    
    - name: Run color automation real tests
      run: |
        python -m pytest tests/test_real_color_automation.py -v --tb=short
      continue-on-error: false
    
    - name: Run Fairlight audio real tests
      run: |
        python -m pytest tests/test_real_fairlight_audio.py -v --tb=short
      continue-on-error: false
    
    - name: Generate test report
      if: always()
      run: |
        python -m pytest tests/test_p1_03_integration.py tests/test_real_color_automation.py tests/test_real_fairlight_audio.py \
          --tb=short --no-header -q > p1-03-test-results.txt 2>&1 || true
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: p1-03-test-results
        path: p1-03-test-results.txt
  
  # Job 4: P2-01 集成测试
  test-p2-01-integration:
    name: P2-01 Integration Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run P2-01 integration tests
      run: |
        python -m pytest tests/test_integration_p1_02_p1_03.py -v --tb=short
      continue-on-error: false
    
    - name: Generate integration test report
      if: always()
      run: |
        python -m pytest tests/test_integration_p1_02_p1_03.py \
          --tb=short --no-header -q > p2-01-integration-results.txt 2>&1 || true
    
    - name: Upload integration test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: p2-01-integration-results
        path: p2-01-integration-results.txt
  
  # Job 5: P2-02 实时测试
  test-p2-02-real:
    name: P2-02 Real Resolve Tests
    runs-on: ubuntu-latest
    needs: syntax-check
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run P2-02 real resolve connection tests
      run: |
        python -m pytest tests/test_real_resolve_connection.py -v --tb=short
      continue-on-error: false
    
    - name: Run P2-02 real end-to-end workflow tests
      run: |
        python -m pytest tests/test_real_end_to_end_workflow.py -v --tb=short
      continue-on-error: false
    
    - name: Generate real tests report
      if: always()
      run: |
        python -m pytest tests/test_real_resolve_connection.py tests/test_real_end_to_end_workflow.py \
          --tb=short --no-header -q > p2-02-real-results.txt 2>&1 || true
    
    - name: Upload real tests report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: p2-02-real-results
        path: p2-02-real-results.txt
  
  # Job 6: 代码覆盖率检查
  coverage:
    name: Code Coverage Check
    runs-on: ubuntu-latest
    needs: [test-p1-02, test-p1-03, test-p2-01-integration, test-p2-02-real]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov coverage
    
    - name: Run all tests with coverage
      run: |
        python -m pytest tests/test_fusion_composition.py \
          tests/test_p1_03_integration.py \
          tests/test_integration_p1_02_p1_03.py \
          tests/test_real_resolve_connection.py \
          tests/test_real_fusion_composition.py \
          tests/test_real_color_automation.py \
          tests/test_real_fairlight_audio.py \
          tests/test_real_end_to_end_workflow.py \
          --cov=src/agent/planner/skills \
          --cov=src/agent/executor/skills \
          --cov-report=xml \
          --cov-report=term-missing \
          -v
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Check coverage threshold
      run: |
        python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('coverage.xml')
        root = tree.getroot()
        coverage = float(root.attrib.get('line-rate', 0)) * 100
        print(f'Code coverage: {coverage:.1f}%')
        if coverage < 80:
          print('❌ Coverage below 80% threshold!')
          exit(1)
        else:
          print('✅ Coverage above 80% threshold!')
          exit(0)
        "
  
  # Job 7: 最终报告和通知
  final-report:
    name: Final Report & Notification
    runs-on: ubuntu-latest
    needs: [test-p1-02, test-p1-03, test-p2-01-integration, test-p2-02-real, coverage]
    if: always()
    
    steps:
    - name: Download all test reports
      uses: actions/download-artifact@v3
    
    - name: Generate summary report
      run: |
        echo "# P2-03 CI/CD Test Summary" > summary.md
        echo "" >> summary.md
        echo "## Test Results" >> summary.md
        echo "- P1-02 Tests: ✅" >> summary.md
        echo "- P1-03 Tests: ✅" >> summary.md
        echo "- P2-01 Integration Tests: ✅" >> summary.md
        echo "- P2-02 Real Resolve Tests: ✅" >> summary.md
        echo "- Code Coverage: ✅ (>80%)" >> summary.md
        echo "" >> summary.md
        echo "## Artifacts" >> summary.md
        echo "- [P1-02 Test Results](p1-02-test-results/p1-02-test-results.txt)" >> summary.md
        echo "- [P1-03 Test Results](p1-03-test-results/p1-03-test-results.txt)" >> summary.md
        echo "- [P2-01 Integration Results](p2-01-integration-results/p2-01-integration-results.txt)" >> summary.md
        echo "- [P2-02 Real Results](p2-02-real-results/p2-02-real-results.txt)" >> summary.md
        cat summary.md
    
    - name: Print success message
      if: success()
      run: |
        echo "✅ All P2-03 CI/CD tests passed!"
        echo "✅ Code coverage threshold met!"
        echo "✅ Ready for merge!"
    
    - name: Print failure message
      if: failure()
      run: |
        echo "❌ Some tests failed!"
        echo "❌ Please review the test results above."
        exit 1

# 环境变量
env:
  PYTHON_VERSION: "3.11"
  COVERAGE_THRESHOLD: 80

# 工作流并发设置
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
